name: Deploy to GitHub Pages

# Builds the WebAssembly game and publishes the static dist/ to GitHub Pages.
# GitHub Pages serves the files directly (no server of ours) — the nginx setup
# in the Dockerfile is a separate self-hosting path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/configure-pages@v5
        id: pages

      # Page/asset paths are relative (work under the /<repo>/ subpath); SITE_URL
      # makes the social-card og:image/og:url absolute, which crawlers require.
      - name: Build web
        run: npm run build:web
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

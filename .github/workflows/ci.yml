name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # macroquad's `audio` feature links quad-alsa-sys (`-lasound`) on Linux;
      # the native build/clippy/test steps need the ALSA dev headers. (X11/GL are
      # dlopen'd at runtime, so they need no dev packages here.)
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Format
        run: cargo fmt --check

      # `clippy::all` is denied via the shared [workspace.lints], so a violation
      # fails here; `pedantic` stays advisory (warnings only) by design.
      # `--workspace` covers both the binary and the `sim` crate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Check web target
        run: cargo check --target wasm32-unknown-unknown

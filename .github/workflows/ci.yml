name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # `clippy::all` is denied via the shared [workspace.lints], so a violation
      # fails here; `pedantic` stays advisory (warnings only) by design.
      # `--workspace` covers both the binary and the `sim` crate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Check web target
        run: cargo check --target wasm32-unknown-unknown

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="OpenSC">
  <!-- Full-bleed square: iOS masks/rounds the apple-touch-icon itself. -->
  <rect width="180" height="180" fill="#1b1b1b"/>
  <text x="90" y="90" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-3" fill="#f5f5f5">SC</text>
</svg>

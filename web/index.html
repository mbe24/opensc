<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>OpenSC — StuntCopter</title>
    <link rel="icon" href="%SITE_URL%assets/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="%SITE_URL%assets/icon.svg">

    <!-- Shared links show the running game, not the repo: own image, own text.
         %SITE_URL% is substituted at build/deploy time (scripts/site-url.mjs) —
         crawlers discard relative paths, so og:image and og:url must be absolute. -->
    <meta name="description" content="A faithful Rust port of Duane Blehm's 1986 Macintosh game StuntCopter. Fly the copter, drop the stuntman, and land him in the moving hay wagon — native and in the browser.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OpenSC">
    <meta property="og:url" content="%SITE_URL%">
    <meta property="og:title" content="StuntCopter — the 1986 Mac classic, in your browser">
    <meta property="og:description" content="Fly the copter, drop the stuntman, land him in the moving wagon. A faithful Rust port — no install, works on desktop and mobile.">
    <meta property="og:image" content="%SITE_URL%assets/social-web.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="640">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="StuntCopter — the 1986 Mac classic, in your browser">
    <meta name="twitter:description" content="Fly the copter, drop the stuntman, land him in the moving wagon. A faithful Rust port — no install, works on desktop and mobile.">
    <meta name="twitter:image" content="%SITE_URL%assets/social-web.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #181818;
        }
        /* Fill the viewport; block browser gestures so touch-drag steers instead
           of scrolling/zooming the page. */
        #glcanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #181818;
            touch-action: none;
            outline: none;
        }
        /* Loading overlay, shown until the wasm module initializes. The real load
           cost is the wasm binary download, not the assets (which are embedded). */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            background: #181818;
            color: #eaeaea;
            font: 500 1rem/1.4 system-ui, sans-serif;
            z-index: 10;
        }
        #loading .spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #3a3a3a;
            border-top-color: #eaeaea;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="0"></canvas>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading StuntCopter…</div>
    </div>

    <!-- Unlock Web Audio as early as possible. Browsers start every AudioContext
         suspended until a user gesture; the game creates its context lazily, so
         register the resume BEFORE it exists (wrap the constructor) and resume on
         the first gesture. Without this the BEGIN tap can be missed and sound
         only starts a second or two later, on the next input. -->
    <script>
        (function () {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            const live = new Set();
            const Wrapped = function (...args) {
                const c = new Ctx(...args);
                live.add(c);
                return c;
            };
            Wrapped.prototype = Ctx.prototype;
            window.AudioContext = Wrapped;
            if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
            const resumeAll = () => live.forEach((c) => {
                if (c.state !== "running") c.resume().catch(() => {});
            });
            for (const ev of ["pointerdown", "touchend", "mousedown", "keydown"]) {
                window.addEventListener(ev, resumeAll, { capture: true });
            }
        })();
    </script>
    <script src="mq_js_bundle.js"></script>
    <script>
        // Remove the loading overlay once the game has initialized.
        miniquad_add_plugin({
            name: "opensc_loader",
            version: "1.0",
            on_init: () => document.getElementById("loading")?.remove(),
        });
        load("stuntcopter.wasm");
    </script>
</body>
</html>

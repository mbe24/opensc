server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Belt-and-suspenders: guarantee the WebAssembly MIME type even on images
    # whose bundled mime.types predates the wasm mapping.
    location ~* \.wasm$ {
        default_type application/wasm;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# Virtual workspace: the two crates are peers.
# - `app/` is the runnable game (window, rendering, audio, input) — the
#   `stuntcopter` executable.
# - `sim/` is the headless game model (rules, state, the fixed-timestep tick),
#   with no macroquad dependency, so it stays testable headless.
[workspace]
members = ["app", "sim"]
resolver = "2"

# Native builds keep the default dev/release profiles (fast incremental compiles,
# `panic = unwind` so `#[should_panic]` tests work).
#
# The web build uses a dedicated profile so its size/speed tuning never leaks
# into native builds. Select it with `--profile wasm-release`. Custom profiles
# must live in the workspace root.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Lint gate, shared by every crate in the workspace. `clippy::all` is a hard
# error (real-bug lints); `pedantic` is advisory (surfaced as warnings, not
# CI-fatal) because it fights the constant i32-pixel <-> f32-vector casts
# inherent to 2D game math. The cast lints are turned off outright for the same
# reason.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
# Prose is full of proper nouns (StuntCopter, macroquad, QuickDraw, GitHub, ...);
# backticking them all would be wrong.
doc_markdown = "allow"
# `dh`/`dv`, `req_dh`/`req_dv` etc. are the original's velocity names; kept for
# a faithful, auditable port.
similar_names = "allow"
